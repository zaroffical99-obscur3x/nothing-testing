<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Worker test lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#1a1822; --panel:#232030; --raise:#2c2939; --line:#3d3952;
  --text:#ebe8f5; --muted:#a29eb8; --accent:#c4b2ff; --ink:#1a1822;
  --ok:#86dcae; --bad:#ff9090; --warn:#f0cb7e;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Syne','Manrope',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{background:var(--bg)}
body{margin:0;font:400 15px/1.55 var(--sans);color:var(--text);background:var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line)}
.top h1{font:700 28px/1.1 var(--disp);margin:0 0 6px;letter-spacing:.2px}
.top p{margin:0;color:var(--muted);max-width:54ch}
.conn{display:flex;flex-direction:column;gap:8px;width:min(100%,400px)}
.conn label{color:var(--muted);font-size:13px}
.statusline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:baseline}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.originmsg{font-size:13px}
.originmsg.bad{color:var(--warn)}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr)}
nav{border-right:1px solid var(--line);padding:14px 14px 40px}
.grp{margin:18px 10px 6px;color:var(--muted);font-size:13px}
.grp:first-child{margin-top:4px}
nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;padding:9px 10px;cursor:pointer;color:var(--text)}
nav button:hover{background:var(--panel)}
nav button[aria-current="true"]{background:var(--raise);border-left-color:var(--accent)}
nav .tick{font-size:12px;color:var(--ok)}
main{padding:24px 28px 80px;min-width:0;max-width:1220px}
.head h2{font:700 24px/1.15 var(--disp);margin:0 0 6px}
.head p{margin:0 0 20px;color:var(--muted);max-width:62ch}

.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h3{font:600 16px/1.3 var(--disp);margin:0 0 10px}
.note p{margin:0 0 12px;color:var(--muted)}

/* form */
.fld{margin-bottom:14px}
.fld label{display:block;margin-bottom:5px;font-weight:500;font-size:14px}
.fld small{display:block;margin-top:5px;color:var(--muted);font-size:13px}
input[type=text],input[type=url],input[type=tel],input[type=number],select,textarea,.c-name,.k-key,.k-val{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
textarea{resize:vertical;min-height:84px}
textarea.code{font:400 13px/1.5 var(--mono);min-height:260px}
.crow,.krow{display:grid;gap:8px;margin-bottom:8px;align-items:center}
.crow{grid-template-columns:minmax(0,1fr) 70px 90px 34px}
.krow{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr) 34px}
.x{background:transparent;border:1px solid var(--line);border-radius:7px;height:36px;cursor:pointer;color:var(--muted)}
.x:hover{color:var(--bad);border-color:var(--bad)}
.cart-total{margin:6px 0 0;color:var(--muted);font-size:13px}
.checkrow{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px}
.checkrow input{margin-top:4px;accent-color:var(--accent)}
.checkrow span{display:block}
.checkrow small{display:block;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.btn{background:var(--accent);color:var(--ink);border:0;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:14px}
.locstat{color:var(--muted);font-size:13px}
.seen{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;cursor:pointer}
.seen input{accent-color:var(--ok)}

/* preview */
pre{margin:0;font:400 12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:380px;overflow:auto}
pre .k{color:var(--accent)} pre .s{color:#9fdcc1} pre .n{color:var(--warn)} pre .b{color:#f3a6c8}
.route{margin:0;padding-left:20px;font:400 12.5px/1.8 var(--mono);color:var(--muted)}
.route li:first-child{color:var(--text)}
.sub{margin:16px 0 8px;font:600 14px var(--disp)}
.badjson{color:var(--bad);font-size:13px;margin-top:6px}

/* tests */
.test{margin-bottom:14px}
.ttop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:6px}
.ttop h3{margin:0}
.ex{margin:0 0 10px;color:var(--muted)}
.resp{margin:0 0 10px;font-size:13px;color:var(--muted)}
.test pre{margin-bottom:12px;max-height:150px}

/* log */
.logsec{margin-top:34px}
.loghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.loghead h3{font:700 20px var(--disp);margin:0}
.empty{color:var(--muted);margin:0;padding:18px;border:1px dashed var(--line);border-radius:10px}
.entry{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;margin-bottom:10px;animation:land .35s ease-out}
.entry.ok{border-left-color:var(--ok)} .entry.bad{border-left-color:var(--bad)}
.entry summary{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:11px 14px;cursor:pointer}
.pill{font:500 12px var(--mono);padding:2px 9px;border-radius:99px;background:var(--raise)}
.ok .pill{color:var(--ok)} .bad .pill{color:var(--bad)}
.meta{color:var(--muted);font-size:13px;margin-left:auto}
.blk{padding:0 14px 14px}
.blk h4{margin:0 0 6px;font:600 13px var(--sans);color:var(--muted)}
.hint{margin:0 14px 12px;color:var(--warn);font-size:13px}
@keyframes land{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .top,main{padding-left:16px;padding-right:16px}
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .grp{display:none}
  nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;width:auto}
  nav button[aria-current="true"]{border-bottom-color:var(--accent)}
  .crow{grid-template-columns:minmax(0,1fr) 58px 76px 34px}
}
@media (prefers-reduced-motion:reduce){.entry{animation:none}}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Worker test lab</h1>
    <p>Send every kind of request to your universal worker, then check Discord to see what arrived.</p>
  </div>
  <div class="conn">
    <label for="url">Worker URL</label>
    <input id="url" type="url" spellcheck="false" autocomplete="off">
    <div class="statusline">
      <span id="origin" class="originmsg"></span>
      <span id="last"><span class="dot"></span>No requests yet</span>
      <span id="prog"></span>
    </div>
  </div>
</header>

<div class="shell">
  <nav id="nav" aria-label="Test scenarios"></nav>
  <main>
    <div id="stage"></div>
    <section class="logsec" aria-labelledby="logtitle">
      <div class="loghead">
        <h3 id="logtitle">Request log</h3>
        <button class="btn ghost sm" id="clear" type="button">Clear log</button>
      </div>
      <p class="empty" id="empty">Nothing sent yet. Pick a scenario and send it. Each request and response shows up here.</p>
      <div id="log" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
(() => {
'use strict';

/* ───────── config mirrored from the worker ───────── */
const ORIGIN_RE = /^https:\/\/([a-z0-9-]+\.)*powertree\.site$/i;
const KNOWN_TYPES = ['order','booking','aboutme','anonymous','question','support','collab','collaboration','contact','report','feedback','signup','newsletter','general'];
const TYPE_TO_SECRET = {
  order:'DISCORD_WEBHOOK_ORDERS', aboutme:'DISCORD_WEBHOOK_ABOUTME', question:'DISCORD_WEBHOOK_QUESTIONS',
  support:'DISCORD_WEBHOOK_SUPPORT', collab:'DISCORD_WEBHOOK_COLLAB', collaboration:'DISCORD_WEBHOOK_COLLAB',
  contact:'DISCORD_WEBHOOK_CONTACT', report:'DISCORD_WEBHOOK_REPORTS', feedback:'DISCORD_WEBHOOK_FEEDBACK'
};
const normType = t => (String(t || 'general').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40)) || 'general';
const secretSafe = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '_');
function siteSlug() {
  const host = location.hostname.toLowerCase();
  if (!/(^|\.)powertree\.site$/.test(host)) return 'unknown';
  return host.replace(/\.?powertree\.site$/, '') || 'root';
}
function routeList(type) {
  const t = normType(type), T = secretSafe(t), S = secretSafe(siteSlug());
  return [...new Set([`DISCORD_WEBHOOK_${S}_${T}`, TYPE_TO_SECRET[t], `DISCORD_WEBHOOK_${T}`, `DISCORD_WEBHOOK_${T}S`, 'DISCORD_WEBHOOK_GENERAL'].filter(Boolean))];
}

/* ───────── small helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid);
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const cut = (s, n) => s.length > n ? s.slice(0, n) + `\n… (cut, ${s.length} characters in total)` : s;
function hl(json) {
  return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(
    /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    m => {
      let c = 'n';
      if (m[0] === '"') c = /:$/.test(m) ? 'k' : 's';
      else if (/true|false|null/.test(m)) c = 'b';
      return `<span class="${c}">${m}</span>`;
    });
}
const showJson = (el, obj) => { el.innerHTML = hl(cut(typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2), 3200)); };

/* ───────── state ───────── */
let workerUrl = store.get('ptlab:url', 'https://api.powertree.site');
let verified = store.get('ptlab:verified', {});
let lastLoc = null;
let current = 'order';

/* ───────── scenarios ───────── */
const FIELD = {
  name:    { label: 'Name', val: 'Test Customer' },
  phone:   { label: 'Phone', val: '0300 1234567', type: 'tel' },
  address: { label: 'Delivery address', val: 'House 12, Street 4, Test Town' },
  notes:   { label: 'Notes', val: 'No onions please', area: true },
  contact: { label: 'Contact', val: '@test_friend on Instagram' },
  subject: { label: 'Subject', val: 'Testing the contact form' },
  message: { label: 'Message', val: 'Hello from the test lab. If you can read this in Discord, the route works.', area: true }
};
const SCEN = {
  order: {
    group: 'Everyday', title: 'Order', type: 'order', locDefault: true, cart: true,
    fields: ['name', 'phone', 'address', 'notes'],
    blurb: 'A full order with customer details, a cart and the visitor’s location.',
    expect: 'A green “New Order” card in your orders channel. Items appear as a bulleted list, the total is calculated for you, and there is a Google Maps link plus the approximate place from the IP address. With the location box unticked you still get the IP-based place.'
  },
  message: {
    group: 'Everyday', title: 'Contact message', type: 'contact', locDefault: false,
    fields: ['name', 'contact', 'subject', 'message'],
    blurb: 'A normal message from a visitor.',
    expect: 'A “New Contact Message” card with name and contact side by side, the subject, and the message in the card body.'
  },
  friend: {
    group: 'Everyday', title: 'Instagram friend', type: 'anonymous',
    fields: [{ k: 'name', label: 'Name (optional)', val: '' }, { k: 'message', val: 'Nice site! The animations are great.' }],
    blurb: 'A friend says whatever they want. Name is optional.',
    expect: 'An “Anonymous Message” card with the message, the source site and the approximate place. Nothing else when the name is empty.'
  },
  types: {
    group: 'Any type', title: 'Every built-in type', typeMode: 'select', locDefault: false,
    fields: ['name', 'contact', 'subject', 'message'],
    blurb: 'Pick any type the worker knows and send the same message through it.',
    expect: 'Each type has its own title and colour. A type with no matching webhook secret falls back to general, so check that channel too if a card seems to be missing.'
  },
  custom: {
    group: 'Any type', title: 'Custom type and fields', typeMode: 'input', locDefault: false, kv: true,
    blurb: 'Invent a type and any fields you like. This is what a brand new site would do.',
    expect: 'A card titled from your type name with a steady colour, and one field per row. Lists and objects are shown as bullet lists. With no secret for the type it lands in general.'
  },
  raw: {
    group: 'Any type', title: 'Raw JSON', raw: true,
    blurb: 'Write the exact JSON body yourself, including nested data.',
    expect: 'Everything in the JSON is rendered: the type decides the title, the message becomes the card body, lists become bullets and objects become key and value lines.'
  }
};
const RAW_SAMPLE = JSON.stringify({
  type: 'booking', name: 'Raw Tester', contact: 'raw@example.com', date: '2026-11-02', guests: 4,
  options: ['window seat', 'birthday cake'], venue: { city: 'Test Town', table: 12 },
  message: 'Everything the worker can render, in one request.'
}, null, 2);

const j = (title, payload, expected = 200) => ({ title, payload, expected });
const TESTS = {
  security: {
    group: 'Checks', title: 'Security checks',
    blurb: 'Hostile input. Every one should arrive as harmless text, or not arrive at all.',
    items: [
      { id: 's-link', title: 'Link and mention in a name',
        expect: 'The name sits in a grey code box. No bold, no clickable link, no ping.',
        payload: { type: 'contact', name: '**@everyone** check this [click](https://evil.com)', message: 'Plain text only, please.' } },
      { id: 's-key', title: 'Markdown in a field name',
        expect: 'The extra field’s title has its markdown stripped and shows @everyone without pinging.',
        payload: { type: 'contact', '**@everyone** [click](https://evil.com)': 'a value', message: 'Field name test' } },
      { id: 's-fence', title: 'Breaking out of the code box',
        expect: 'The whole text stays inside one code box. The backticks are swapped for lookalikes.',
        payload: { type: 'contact', message: '```\n@everyone\n[click](https://evil.com)\n```\nI tried to close your code box.' } },
      { id: 's-source', title: 'Spoofed source',
        expect: 'Source is shown in a code box, so the fake link is not clickable.',
        payload: { type: 'contact', source: '**[trusted](https://evil.com)**', message: 'Source spoof' } },
      { id: 's-type', title: 'Odd characters in the type',
        expect: 'The type is cleaned to “orderscripteveryone”, so it goes to the general channel with a generated title.',
        payload: { type: 'ORDER<script>@everyone', message: 'Type cleaning' } },
      { id: 's-hp', title: 'Honeypot filled',
        expect: 'The log says success, but nothing should arrive in Discord. That is the trap working.',
        payload: { type: 'contact', name: 'Bot', message: 'I should be ignored', _hp: 'gotcha' } },
      { id: 's-long', title: 'Very long message',
        expect: 'The message is cut near 3500 characters and ends with …',
        payload: { type: 'contact', name: 'Long Writer', message: 'The quick brown fox jumps over the lazy dog. '.repeat(140) } },
      { id: 's-many', title: '40 extra fields',
        expect: 'The card shows 25 fields at most. The rest are dropped without an error.',
        payload: { type: 'contact', message: 'Field overflow', ...Object.fromEntries(Array.from({ length: 40 }, (_, i) => ['field_' + (i + 1), 'value ' + (i + 1)])) } }
    ].map(i => ({ ...i, run: () => sendJson(i.title, i.payload, 200) }))
  },
  formats: {
    group: 'Checks', title: 'Formats and limits',
    blurb: 'Other ways to talk to the worker, plus requests it should refuse.',
    items: [
      { id: 'f-form', title: 'Form-encoded body', resp: 'HTTP 200',
        expect: 'A normal contact card, as if it came from JSON.',
        show: 'type=contact&name=Form Sender&message=Sent as application/x-www-form-urlencoded',
        run() { return transmit({ label: this.title, show: this.show, body: new URLSearchParams({ type: 'contact', name: 'Form Sender', message: 'Sent as application/x-www-form-urlencoded' }) }); } },
      { id: 'f-multi', title: 'Multipart form with a file', resp: 'HTTP 200',
        expect: 'A contact card. The attachment field shows [file: hello.txt]. The file contents are not forwarded.',
        show: 'multipart/form-data: type, name, message, attachment (hello.txt)',
        run() {
          const fd = new FormData();
          fd.set('type', 'contact'); fd.set('name', 'Multipart Sender'); fd.set('message', 'Sent as multipart/form-data');
          fd.set('attachment', new Blob(['hello'], { type: 'text/plain' }), 'hello.txt');
          return transmit({ label: this.title, show: this.show, body: fd });
        } },
      { id: 'f-text', title: 'Plain text body', resp: 'HTTP 200',
        expect: 'A card in the general channel whose message is the text you sent.',
        show: 'Plain text body from the test lab',
        run() { return transmit({ label: this.title, show: this.show, headers: { 'Content-Type': 'text/plain' }, body: this.show }); } },
      { id: 'f-badjson', title: 'Broken JSON', resp: 'HTTP 400', expected: 400,
        expect: 'Nothing arrives in Discord. The response says Invalid JSON body.',
        show: '{oops',
        run() { return transmit({ label: this.title, show: this.show, headers: { 'Content-Type': 'application/json' }, body: this.show, expected: 400 }); } },
      { id: 'f-array', title: 'Array instead of an object', resp: 'HTTP 400',
        expect: 'Nothing arrives in Discord. The response says Body must be a JSON object.',
        show: '[1,2,3]',
        run() { return transmit({ label: this.title, show: this.show, headers: { 'Content-Type': 'application/json' }, body: this.show, expected: 400 }); } },
      { id: 'f-get', title: 'GET request', resp: 'HTTP 405',
        expect: 'Nothing arrives in Discord. The worker only accepts POST.',
        show: '(GET, no body)',
        run() { return transmit({ label: this.title, show: this.show, method: 'GET', expected: 405 }); } },
      { id: 'f-huge', title: 'Oversized body (about 120 KB)', resp: 'HTTP 413',
        expect: 'Nothing arrives in Discord. The worker refuses anything over 100 KB.',
        show: '{"type":"contact","message":"xxxxxxxx… (120,000 characters)"}',
        run() { return transmit({ label: this.title, show: this.show, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'contact', message: 'x'.repeat(120000) }), expected: 413 }); } },
      { id: 'f-burst', title: 'Burst of 12 requests', resp: 'HTTP 200 for the first 10, then 429 if rate limiting is on',
        expect: 'Sends 12 messages one after another. With the RATE_KV binding set up you should see 10 cards in the general channel and then 429 responses. Without it all 12 go through.',
        show: '12 × {"type":"general","message":"Burst n of 12"}',
        async run() {
          for (let n = 1; n <= 12; n++) {
            await transmit({ label: `Burst ${n} of 12`, show: JSON.stringify({ type: 'general', message: `Burst ${n} of 12` }), headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'general', message: `Burst ${n} of 12` }), expected: null, quiet: true });
          }
        } }
    ]
  }
};
const ALL_KEYS = [...Object.keys(SCEN), ...Object.values(TESTS).flatMap(t => t.items.map(i => i.id))];
const titleOf = id => (SCEN[id] || TESTS[id]).title;
const NAV = [
  { g: 'Everyday', ids: ['order', 'message', 'friend'] },
  { g: 'Any type', ids: ['types', 'custom', 'raw'] },
  { g: 'Checks', ids: ['security', 'formats'] }
];

/* ───────── sending ───────── */
const logEl = $('#log'), emptyEl = $('#empty');
function setConn(ok, text) {
  $('#last').innerHTML = `<span class="dot ${ok === null ? '' : ok ? 'ok' : 'bad'}"></span>`;
  $('#last').append(text);
}
async function transmit({ label, method = 'POST', headers, body, expected = 200, show, quiet = false }) {
  const t0 = performance.now();
  let status = null, text = '', net = null;
  try {
    const res = await fetch(workerUrl.trim(), { method, headers, body });
    status = res.status; text = await res.text();
  } catch (e) { net = e.message || 'Network error'; }
  const ms = Math.round(performance.now() - t0);
  const good = net ? false : expected == null ? status >= 200 && status < 300 : status === expected;
  setConn(net ? false : good, net ? 'Last request failed' : `Last request: ${status} in ${ms} ms`);
  addLog({ label, status, ms, expected, good, show: show ?? (typeof body === 'string' ? body : ''), text, net, quiet });
  return status;
}
const sendJson = (label, payload, expected = 200) =>
  transmit({ label, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), expected, show: JSON.stringify(payload, null, 2) });

function addLog(e) {
  let pretty = e.text;
  try { pretty = JSON.stringify(JSON.parse(e.text), null, 2); } catch {}
  const verdict = e.net ? '' : e.expected == null ? '' : e.good ? ' · as expected' : ` · expected ${e.expected}`;
  const d = h('details', { class: 'entry ' + (e.good ? 'ok' : 'bad') },
    h('summary', {},
      h('span', { class: 'pill', text: e.net ? 'No response' : String(e.status) }),
      h('strong', { text: e.label }),
      h('span', { class: 'meta', text: `${new Date().toLocaleTimeString()} · ${e.ms} ms${verdict}` })),
    e.net ? h('p', { class: 'hint', text: `The browser could not read a response (${e.net}). Usually the page is not served from a powertree.site address, the worker URL is wrong, or you are offline.` }) : null,
    h('div', { class: 'blk' }, h('h4', { text: 'Request' }), h('pre', { text: cut(e.show || '(no body)', 2000) })),
    h('div', { class: 'blk' }, h('h4', { text: 'Response' }), h('pre', { text: e.net ? '(none)' : (pretty || '(empty body)') })));
  d.open = !e.quiet;
  logEl.prepend(d);
  while (logEl.children.length > 40) logEl.lastChild.remove();
  emptyEl.hidden = true;
}
$('#clear').addEventListener('click', () => { logEl.innerHTML = ''; emptyEl.hidden = false; });

/* ───────── location ───────── */
function getLoc() {
  return new Promise(res => {
    if (!navigator.geolocation) { locNote('This browser has no location support.'); return res(null); }
    navigator.geolocation.getCurrentPosition(
      p => {
        lastLoc = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), accuracy: Math.round(p.coords.accuracy) };
        locNote(`Got ${lastLoc.lat}, ${lastLoc.lng} (±${lastLoc.accuracy} m)`);
        res(lastLoc);
      },
      e => {
        lastLoc = null;
        locNote(e.code === 1 ? 'Location is blocked. Allow it in the browser’s site settings to test the map link.' : e.code === 3 ? 'Location timed out.' : 'Location is unavailable.');
        res(null);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}
function locNote(t) { const n = $('#locstat'); if (n) n.textContent = t; }

/* ───────── progress and navigation ───────── */
function updateProg() {
  const n = ALL_KEYS.filter(k => verified[k]).length;
  $('#prog').textContent = `Seen in Discord: ${n} of ${ALL_KEYS.length}`;
}
function renderNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  for (const grp of NAV) {
    nav.append(h('div', { class: 'grp', text: grp.g }));
    for (const id of grp.ids) {
      let tick = '';
      if (SCEN[id]) tick = verified[id] ? '✓' : '';
      else { const its = TESTS[id].items, n = its.filter(i => verified[i.id]).length; tick = n ? `${n}/${its.length}` : ''; }
      nav.append(h('button', { type: 'button', 'aria-current': String(id === current), onclick: () => show(id) },
        h('span', { text: titleOf(id) }), h('span', { class: 'tick', text: tick })));
    }
  }
}
function verifyBox(key) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!verified[key];
  cb.addEventListener('change', () => { verified[key] = cb.checked; store.set('ptlab:verified', verified); renderNav(); updateProg(); });
  return h('label', { class: 'seen' }, cb, 'Seen in Discord');
}
function show(id) { current = id; renderNav(); (SCEN[id] ? renderForm : renderTests)(id); }

/* ───────── form scenarios ───────── */
const fld = (id, label, ctrl, hint) => h('div', { class: 'fld' }, h('label', { for: id, text: label }), ctrl, hint ? h('small', { text: hint }) : null);

function cartEditor(onChange) {
  const rows = h('div'), total = h('p', { class: 'cart-total' });
  const recalc = () => {
    const items = get();
    const sum = items.reduce((a, i) => a + i.qty * i.price, 0);
    total.textContent = `Cart total on this page: ${Math.round(sum * 100) / 100}. The worker calculates its own.`;
  };
  function addRow(n = '', q = 1, p = '') {
    const r = h('div', { class: 'crow' },
      h('input', { class: 'c-name', type: 'text', placeholder: 'Item', value: n, 'aria-label': 'Item name' }),
      h('input', { class: 'c-qty', type: 'number', min: '1', value: q, 'aria-label': 'Quantity' }),
      h('input', { class: 'c-price', type: 'number', min: '0', step: 'any', value: p, 'aria-label': 'Price' }),
      h('button', { type: 'button', class: 'x', 'aria-label': 'Remove item', text: '×', onclick: () => { r.remove(); recalc(); onChange(); } }));
    r.addEventListener('input', () => { recalc(); onChange(); });
    rows.append(r);
  }
  function get() {
    return [...rows.children].map(r => ({
      name: $('.c-name', r).value.trim(), qty: Number($('.c-qty', r).value) || 1, price: Number($('.c-price', r).value) || 0
    })).filter(i => i.name);
  }
  addRow('Margherita pizza', 2, 900); addRow('Cola', 1, 150);
  recalc();
  const el = h('div', { class: 'fld' }, h('label', { text: 'Cart' }), rows, total,
    h('button', { type: 'button', class: 'btn ghost sm', text: 'Add item', onclick: () => { addRow(); onChange(); } }));
  return { el, get };
}

function kvEditor(onChange) {
  const rows = h('div');
  function addRow(k = '', v = '') {
    const r = h('div', { class: 'krow' },
      h('input', { class: 'k-key', type: 'text', placeholder: 'Field name', value: k, 'aria-label': 'Field name' }),
      h('input', { class: 'k-val', type: 'text', placeholder: 'Value', value: v, 'aria-label': 'Field value' }),
      h('button', { type: 'button', class: 'x', 'aria-label': 'Remove field', text: '×', onclick: () => { r.remove(); onChange(); } }));
    r.addEventListener('input', onChange);
    rows.append(r);
  }
  [['mood', 'happy'], ['rating', '5'], ['tags', '["night","quiet"]'], ['extra', '{"floor":2,"door":"red"}']].forEach(([k, v]) => addRow(k, v));
  function get() {
    const out = {};
    for (const r of rows.children) {
      const k = $('.k-key', r).value.trim(); if (!k) continue;
      const raw = $('.k-val', r).value;
      let v = raw;
      try { const p = JSON.parse(raw); if (typeof p !== 'string') v = p; } catch {}
      out[k] = v;
    }
    return out;
  }
  const el = h('div', { class: 'fld' }, h('label', { text: 'Fields' }), rows,
    h('button', { type: 'button', class: 'btn ghost sm', text: 'Add field', onclick: () => addRow() }),
    h('small', { text: 'Values like 42, true, [..] or {..} are sent as JSON. Anything else is sent as text.' }));
  return { el, get };
}

function renderForm(id) {
  const s = SCEN[id], stage = $('#stage');
  stage.innerHTML = '';
  stage.append(h('div', { class: 'head' }, h('h2', { text: s.title }), h('p', { text: s.blurb })));

  const form = h('form', { class: 'card', autocomplete: 'off' });
  const pv = h('pre'), routeEl = h('ol', { class: 'route' }), bad = h('div', { class: 'badjson' });
  let typeCtl = null, cart = null, kv = null, rawCtl = null, locCb = null;

  const payload = async (fetchLoc) => {
    if (s.raw) { try { return JSON.parse(rawCtl.value); } catch { return null; } }
    const p = { type: s.type || typeCtl.value };
    for (const f of (s.fields || [])) {
      const v = $('#f-' + (f.k || f)).value.trim(); if (v) p[f.k || f] = v;
    }
    if (cart) p.items = cart.get();
    if (kv) Object.assign(p, kv.get());
    p.source = location.hostname || 'local-file';
    if (locCb && locCb.checked) {
      if (fetchLoc) await getLoc();
      p.location = lastLoc || '(your device location is requested when you press Send)';
    }
    return p;
  };
  const refresh = async () => {
    const p = await payload(false);
    if (p == null) { pv.textContent = ''; bad.textContent = 'This is not valid JSON yet.'; routeEl.innerHTML = ''; sendBtn.disabled = true; return; }
    bad.textContent = ''; sendBtn.disabled = false;
    showJson(pv, p);
    routeEl.innerHTML = '';
    routeList(p.type).forEach(n => routeEl.append(h('li', { text: n })));
  };

  const sendBtn = h('button', { class: 'btn', type: 'submit', text: 'Send' });

  if (s.typeMode === 'select') {
    typeCtl = h('select', { id: 'f-type' }, KNOWN_TYPES.map(t => h('option', { value: t, text: t })));
    typeCtl.value = 'contact';
    form.append(fld('f-type', 'Type', typeCtl, 'Decides the channel, the card title and the colour.'));
  } else if (s.typeMode === 'input') {
    typeCtl = h('input', { id: 'f-type', type: 'text', value: 'prayer', list: 'types', spellcheck: 'false' });
    form.append(fld('f-type', 'Type', typeCtl, 'Anything works. Letters, numbers, dashes and underscores are kept.'), h('datalist', { id: 'types' }, KNOWN_TYPES.map(t => h('option', { value: t }))));
  }

  if (s.raw) {
    rawCtl = h('textarea', { id: 'f-raw', class: 'code', spellcheck: 'false' });
    rawCtl.value = RAW_SAMPLE;
    form.append(fld('f-raw', 'JSON body', rawCtl));
  }

  for (const f0 of (s.fields || [])) {
    const f = typeof f0 === 'string' ? { k: f0, ...FIELD[f0] } : { ...FIELD[f0.k], ...f0 };
    const ctl = f.area ? h('textarea', { id: 'f-' + f.k }) : h('input', { id: 'f-' + f.k, type: f.type || 'text' });
    ctl.value = f.val;
    form.append(fld('f-' + f.k, f.label, ctl));
  }
  if (s.cart) { cart = cartEditor(refresh); form.append(cart.el); }
  if (s.kv) { kv = kvEditor(refresh); form.append(kv.el); }

  if (s.locDefault !== undefined) {
    locCb = h('input', { type: 'checkbox', id: 'f-loc' });
    locCb.checked = s.locDefault;
    form.append(h('div', { class: 'checkrow' }, locCb,
      h('span', {}, h('label', { for: 'f-loc', text: 'Attach my device location' }),
        h('small', { text: 'The browser asks permission. The IP-based place is always added by the worker.' }))));
  }

  const actions = h('div', { class: 'actions' }, sendBtn);
  if (locCb) actions.append(h('button', { type: 'button', class: 'btn ghost', text: 'Check location only', onclick: async () => { await getLoc(); refresh(); } }), h('span', { class: 'locstat', id: 'locstat' }));
  form.append(actions);

  form.addEventListener('input', refresh);
  form.addEventListener('change', refresh);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    const p = await payload(true);
    if (p) await sendJson(s.title, p);
    sendBtn.textContent = 'Send'; sendBtn.disabled = false;
    refresh();
  });

  const expectCard = h('div', { class: 'card note' }, h('h3', { text: 'What you should see in Discord' }), h('p', { text: s.expect }), verifyBox(id));
  const side = h('aside', { class: 'card' },
    h('h3', { text: 'Payload that will be sent' }), pv, bad,
    h('div', { class: 'sub', text: 'Webhook secrets the worker tries, in order' }), routeEl);

  stage.append(h('div', { class: 'cols' }, h('div', { class: 'stack' }, form, expectCard), side));
  refresh();
}

/* ───────── test pages ───────── */
function renderTests(id) {
  const t = TESTS[id], stage = $('#stage');
  stage.innerHTML = '';
  stage.append(h('div', { class: 'head' }, h('h2', { text: t.title }), h('p', { text: t.blurb })));
  for (const it of t.items) {
    const btn = h('button', { type: 'button', class: 'btn sm', text: 'Run', onclick: async () => {
      btn.disabled = true; btn.textContent = 'Running…';
      await it.run(); btn.textContent = 'Run'; btn.disabled = false;
    } });
    const pre = h('pre');
    if (it.payload) showJson(pre, it.payload); else pre.textContent = it.show;
    stage.append(h('article', { class: 'card test' },
      h('div', { class: 'ttop' }, h('h3', { text: it.title }), btn),
      h('p', { class: 'resp', text: 'Response: ' + (it.resp || 'HTTP 200') }),
      h('p', { class: 'ex', text: it.expect }),
      pre, verifyBox(it.id)));
  }
}

/* ───────── header wiring ───────── */
const urlEl = $('#url');
urlEl.value = workerUrl;
urlEl.addEventListener('change', () => { workerUrl = urlEl.value.trim() || 'https://api.powertree.site'; urlEl.value = workerUrl; store.set('ptlab:url', workerUrl); });

const okOrigin = ORIGIN_RE.test(location.origin);
const om = $('#origin');
om.className = 'originmsg' + (okOrigin ? '' : ' bad');
om.textContent = okOrigin
  ? `Origin ${location.host} is allowed by the worker.`
  : `Origin ${location.origin === 'null' ? 'file://' : location.origin} is not allowed, so the worker will answer 403. Open this page from a powertree.site address.`;

updateProg();
show(current);
})();
</script>
</body>
</html>
